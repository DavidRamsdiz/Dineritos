<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dineritos</title>
<meta name="description" content="Finanzas personales sobre tu Excel de OneDrive.">
<meta name="theme-color" content="#F0F2F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12151A" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dineritos">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* ---------- reset ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body,h1,h2,h3,h4,p,figure,ul,ol,dl,dd{margin:0}
ul,ol{padding:0;list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
table{border-collapse:collapse;width:100%}
img,svg{display:block;max-width:100%}

/* ---------- tokens: claro ---------- */
:root{
  --ground:#F0F2F5; --surface:#FFFFFF; --surface-2:#F7F8FA; --surface-3:#EAEDF2;
  --ink:#12161D; --muted:#586373; --faint:#8B94A3;
  --line:#DDE2E9; --line-strong:#C3CBD6; --track:#E5E9EF;
  --accent:#025AC3; --accent-ink:#024099; --accent-soft:#E5ECFA; --accent-line:#B9CDEE;
  --ochre:#B27702; --ochre-soft:#F6EFDC; --ochre-line:#E4D2A4;
  --oxide:#B62B03; --oxide-soft:#FAE8E1; --oxide-line:#EEC4B4;
  --on-accent:#FFFFFF;
  --shadow:0 1px 1px rgba(18,22,29,.04),0 6px 16px rgba(18,22,29,.05);
  --shadow-lift:0 2px 4px rgba(18,22,29,.06),0 14px 34px rgba(18,22,29,.10);
  --ff-display:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --ff-body:"IBM Plex Sans",system-ui,-apple-system,Segoe UI,sans-serif;
  --ff-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r-sm:6px; --r:10px; --r-lg:14px;
}
/* ---------- tokens: oscuro (preferencia del sistema) ---------- */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#12151A; --surface:#1C2027; --surface-2:#232932; --surface-3:#2A313B;
  --ink:#E7EAEE; --muted:#98A2B0; --faint:#6E7885;
  --line:#2B323B; --line-strong:#3D4652; --track:#262D36;
  --accent:#5990FB; --accent-ink:#8FB4FD; --accent-soft:#16233A; --accent-line:#2E4470;
  --ochre:#AF8A0E; --ochre-soft:#2A2412; --ochre-line:#4C4118;
  --oxide:#C24601; --oxide-soft:#301A0E; --oxide-line:#572C13;
  --on-accent:#0B1220;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.45);
  --shadow-lift:0 2px 6px rgba(0,0,0,.5),0 16px 38px rgba(0,0,0,.55);
}}
/* ---------- tokens: oscuro (elegido explicitamente) ---------- */
:root[data-theme="dark"]{
  --ground:#12151A; --surface:#1C2027; --surface-2:#232932; --surface-3:#2A313B;
  --ink:#E7EAEE; --muted:#98A2B0; --faint:#6E7885;
  --line:#2B323B; --line-strong:#3D4652; --track:#262D36;
  --accent:#5990FB; --accent-ink:#8FB4FD; --accent-soft:#16233A; --accent-line:#2E4470;
  --ochre:#AF8A0E; --ochre-soft:#2A2412; --ochre-line:#4C4118;
  --oxide:#C24601; --oxide-soft:#301A0E; --oxide-line:#572C13;
  --on-accent:#0B1220;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 22px rgba(0,0,0,.45);
  --shadow-lift:0 2px 6px rgba(0,0,0,.5),0 16px 38px rgba(0,0,0,.55);
}

/* ---------- base ---------- */
body{
  background:var(--ground); color:var(--ink);
  font-family:var(--ff-body); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.num{font-family:var(--ff-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.eyebrow{
  font-family:var(--ff-mono); font-size:10.5px; font-weight:500;
  letter-spacing:.11em; text-transform:uppercase; color:var(--faint);
}
h1,h2,h3{font-family:var(--ff-display);font-weight:600;letter-spacing:-.005em;text-wrap:balance}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

/* ---------- estructura ---------- */
.shell{max-width:1120px;margin:0 auto;padding:0 14px 100px}
@media (min-width:860px){.shell{padding:0 24px 48px}}

.topbar{
  position:sticky;top:0;z-index:40;background:var(--ground);
  border-bottom:1px solid var(--line);
}
.topbar-in{max-width:1120px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px}
@media (min-width:860px){.topbar-in{padding:12px 24px;gap:12px}}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto;min-width:0}
.brand b{font-family:var(--ff-display);font-size:20px;font-weight:700;letter-spacing:-.01em}
.brand span{font-family:var(--ff-mono);font-size:10.5px;color:var(--faint);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
@media (max-width:560px){.brand span{display:none}}

.btn{
  display:inline-flex;align-items:center;gap:7px;padding:7px 13px;border-radius:var(--r-sm);
  border:1px solid var(--line-strong);background:var(--surface);font-size:13.5px;font-weight:500;
  white-space:nowrap;transition:background .12s,border-color .12s;
}
.btn:hover{background:var(--surface-2);border-color:var(--faint)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn-primary:hover{background:var(--accent-ink);border-color:var(--accent-ink)}
.btn-quiet{border-color:transparent;background:transparent;color:var(--muted)}
.btn-quiet:hover{background:var(--surface-3);color:var(--ink)}
.btn-danger{color:var(--oxide);border-color:var(--oxide-line)}
.btn-danger:hover{background:var(--oxide-soft)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-sm{padding:4px 9px;font-size:12.5px}
.btn-icon{padding:6px;width:31px;height:31px;justify-content:center}

.saveflag{
  display:inline-flex;align-items:center;gap:6px;font-family:var(--ff-mono);
  font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);
}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.dot.on{background:var(--accent)}
.dot.warn{background:var(--ochre)}

/* ---------- navegacion ---------- */
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{
  padding:8px 13px;border-radius:var(--r-sm);font-size:13.5px;font-weight:500;color:var(--muted);
  white-space:nowrap;border:1px solid transparent;
}
.nav button:hover{background:var(--surface-3);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--surface);color:var(--ink);border-color:var(--line);box-shadow:var(--shadow);font-weight:600}
.navdesk{display:none}
@media (min-width:860px){.navdesk{display:flex;margin:18px 0 4px}}
.navmob{
  position:fixed;left:0;right:0;bottom:0;z-index:45;background:var(--surface);
  border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;
}
.navmob button{flex:1;text-align:center;font-size:12px;padding:8px 4px}
@media (min-width:860px){.navmob{display:none}}

/* ---------- tarjetas ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.card-pad{padding:16px}
@media (min-width:600px){.card-pad{padding:20px}}
.stack{display:flex;flex-direction:column;gap:14px}
.stack-lg{display:flex;flex-direction:column;gap:20px}
.sechead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sechead h2{font-size:17px}
.sechead .right{margin-left:auto;color:var(--muted);font-size:13px}
.hint{color:var(--muted);font-size:13px}
.hint-sm{color:var(--faint);font-size:12px;line-height:1.5}
hr.divider{height:1px;background:var(--line);border:0;margin:14px 0}

/* ---------- cabecera del mes ---------- */
.mespick{display:flex;align-items:center;gap:8px;margin:16px 0 14px}
.mespick h1{font-size:clamp(24px,5.4vw,32px);line-height:1.05;flex:1;min-width:0}
.mespick h1 i{font-style:normal;color:var(--faint);font-weight:600}
select.sel{
  padding:7px 9px;border:1px solid var(--line-strong);border-radius:var(--r-sm);
  background:var(--surface);font-size:13.5px;
}

/* ---------- KPIs ---------- */
.kpis{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:560px){.kpis{grid-template-columns:repeat(3,1fr)}}
.kpis-4{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (min-width:760px){.kpis-4{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:14px 15px;box-shadow:var(--shadow)}
.kpi .k-l{font-family:var(--ff-mono);font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.kpi .k-n{font-family:var(--ff-mono);font-weight:600;font-size:24px;line-height:1.1;margin-top:7px;letter-spacing:-.03em}
@media (min-width:560px){.kpi .k-n{font-size:25px}}
.kpi .k-n.pos{color:var(--accent)}
.kpi .k-n.neg{color:var(--oxide)}
.kpi .k-s{font-size:12.5px;color:var(--muted);margin-top:5px}
.kpi .k-s b{font-family:var(--ff-mono);font-weight:500}

/* ---------- la regla proporcional: motivo recurrente ---------- */
.rule{height:7px;border-radius:4px;background:var(--track);display:flex;gap:2px;overflow:hidden;margin-top:9px}
.rule i{display:block;border-radius:4px;min-width:0}
.rule i.a{background:var(--accent)}
.rule i.o{background:var(--ochre)}
.rule i.x{background:var(--oxide)}
.rule i.g{background:var(--line-strong)}

/* ---------- medidores de presupuesto ---------- */
.meters{display:grid;gap:14px}
@media (min-width:700px){.meters{grid-template-columns:1fr 1fr;gap:14px 26px}}
.meter-top{display:flex;align-items:baseline;gap:8px;font-size:13.5px}
.meter-top b{font-weight:500}
.meter-top .m-v{margin-left:auto;font-family:var(--ff-mono);font-size:12.5px;color:var(--muted);white-space:nowrap}
.meter-top .m-v em{font-style:normal;color:var(--ink);font-weight:500}
.meter-track{position:relative;height:10px;border-radius:5px;background:var(--track);margin-top:7px}
.meter-fill{position:absolute;top:0;bottom:0;left:0;border-radius:5px;background:var(--accent)}
.meter-fill.over{background:var(--oxide)}
.meter-fill.hucha{background:var(--ochre)}
.meter-cap{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.5}
.meter-foot{display:flex;justify-content:space-between;gap:10px;margin-top:5px;font-size:11.5px;color:var(--faint);font-family:var(--ff-mono)}
.meter-foot .over{color:var(--oxide);font-weight:500}

/* ---------- tablas ---------- */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.t{font-size:13.5px}
table.t.wide{min-width:600px}
table.t.mid{min-width:480px}
table.t th{
  text-align:left;font-family:var(--ff-mono);font-size:10px;font-weight:500;letter-spacing:.09em;
  text-transform:uppercase;color:var(--faint);padding:0 8px 7px;border-bottom:1px solid var(--line);white-space:nowrap;
}
table.t td{padding:8px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tbody tr:last-child td{border-bottom:0}
table.t td.n,table.t th.n{text-align:right;font-family:var(--ff-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
table.t tbody tr:hover{background:var(--surface-2)}
table.t tr.sum td{border-top:2px solid var(--line-strong);border-bottom:0;font-weight:600;padding-top:10px}
table.t tr.sub td{color:var(--muted)}
table.t td.c-name{font-weight:500;min-width:140px}
table.t td.c-name small{display:block;font-weight:400;color:var(--faint);font-size:11.5px;line-height:1.35;margin-top:1px}
.dev{font-family:var(--ff-mono);font-size:12.5px}
.dev.up{color:var(--oxide)}
.dev.down{color:var(--accent)}
.zero{color:var(--faint)}
.pos{color:var(--accent)}
.neg{color:var(--oxide)}

.tag{
  display:inline-block;padding:2px 7px;border-radius:20px;font-family:var(--ff-mono);
  font-size:10px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;
  border:1px solid var(--line);background:var(--surface-2);color:var(--muted);
}
.tag.plan{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-ink)}
.tag.hucha{background:var(--ochre-soft);border-color:var(--ochre-line);color:var(--ochre)}
.tag.ahorro{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-ink)}
.tag.gasto{background:var(--oxide-soft);border-color:var(--oxide-line);color:var(--oxide)}

/* ---------- formularios ---------- */
.inp{
  width:100%;padding:7px 9px;border:1px solid var(--line-strong);border-radius:var(--r-sm);
  background:var(--surface);font-size:13.5px;
}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.inp.n{text-align:right;font-family:var(--ff-mono);font-variant-numeric:tabular-nums}
.inp-w{width:100px}
input.inp[type=number]{-moz-appearance:textfield}
input.inp[type=number]::-webkit-outer-spin-button,input.inp[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-family:var(--ff-mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.grid2{display:grid;gap:12px}
@media (min-width:620px){.grid2{grid-template-columns:1fr 1fr;gap:12px 20px}}
.auto-pill{
  font-family:var(--ff-mono);font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--faint);border:1px dashed var(--line-strong);border-radius:20px;padding:2px 7px;
}
.auto-pill:hover{color:var(--accent);border-color:var(--accent)}
.realcell{display:flex;align-items:center;gap:6px;justify-content:flex-end}

/* ---------- anadir gasto ---------- */
.quickadd{display:grid;gap:10px}
@media (min-width:820px){.quickadd{grid-template-columns:1.6fr 1.1fr .8fr .9fr auto;align-items:end}}
.fab{
  position:fixed;right:14px;bottom:calc(68px + env(safe-area-inset-bottom));z-index:44;
  padding:13px 18px;border-radius:26px;background:var(--accent);color:var(--on-accent);
  font-weight:600;font-size:14.5px;box-shadow:var(--shadow-lift);display:inline-flex;gap:8px;align-items:center;
}
@media (min-width:860px){.fab{display:none}}

/* ---------- graficos ---------- */
.bars{display:flex;align-items:stretch;gap:3px;height:170px}
.bars .col{flex:1;display:flex;flex-direction:column;position:relative;cursor:default;min-width:0}
.bars .col .up{display:flex;flex-direction:column;justify-content:flex-end}
.bars .col .dn{display:flex;flex-direction:column;justify-content:flex-start}
.bars .col i{display:block;background:var(--accent);border-radius:4px 4px 0 0}
.bars .col i.neg{background:var(--oxide);border-radius:0 0 4px 4px}
.bars .col:hover i{filter:brightness(1.12);box-shadow:0 0 0 2px var(--surface)}
.bars .col.sel i{box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--ink)}
.zeroline{height:1px;background:var(--line-strong)}
.bars-axis{display:flex;gap:3px;margin-top:6px}
.bars-axis span{flex:1;text-align:center;font-family:var(--ff-mono);font-size:9.5px;color:var(--faint);overflow:hidden;min-width:0}

.hbars{display:grid;gap:9px}
.hbar{display:grid;grid-template-columns:104px 1fr 92px;align-items:center;gap:10px;font-size:13px}
@media (max-width:560px){.hbar{grid-template-columns:92px 1fr 78px;gap:8px}}
.hbar .hb-l{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar .hb-t{position:relative;height:11px;background:var(--track);border-radius:5px}
.hbar .hb-f{position:absolute;top:0;bottom:0;left:0;background:var(--accent);border-radius:5px}
.hbar .hb-g{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--line-strong)}
.hbar .hb-v{text-align:right;font-family:var(--ff-mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.hbar:hover .hb-f{filter:brightness(1.12)}

svg.spark{width:100%;height:auto;display:block;overflow:visible}
svg.spark .grid{stroke:var(--line);stroke-width:1}
svg.spark .goal{stroke:var(--line-strong);stroke-width:1.5;stroke-dasharray:5 4}
svg.spark .area{fill:var(--accent);opacity:.13}
svg.spark .line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
svg.spark .end{fill:var(--accent);stroke:var(--surface);stroke-width:2}
svg.spark .cross{stroke:var(--ink);stroke-width:1;opacity:.35}
svg.spark text{font-family:var(--ff-mono);font-size:9.5px;fill:var(--faint)}

.tip{
  position:fixed;z-index:70;pointer-events:none;opacity:0;transform:translate(-50%,-124%);
  background:var(--ink);color:var(--ground);padding:7px 10px;border-radius:var(--r-sm);
  font-size:12px;line-height:1.4;box-shadow:var(--shadow-lift);max-width:240px;transition:opacity .09s;
}
.tip b{font-family:var(--ff-mono);font-weight:600}
.tip.show{opacity:1}

.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:block;flex:none}
.legend i.a{background:var(--accent)}
.legend i.o{background:var(--ochre)}
.legend i.x{background:var(--oxide)}
.legend i.g{background:var(--line-strong)}

.split{display:flex;height:36px;border-radius:var(--r-sm);overflow:hidden;gap:2px;background:var(--track)}
.split div{display:flex;align-items:center;justify-content:center;font-family:var(--ff-mono);font-size:12px;font-weight:600;color:var(--on-accent);min-width:40px}
.split .d{background:var(--accent)}
.split .c{background:var(--ochre)}

/* ---------- avisos ---------- */
.note{border-radius:var(--r);padding:11px 13px;font-size:13px;display:flex;gap:9px;align-items:flex-start;line-height:1.45}
.note b{font-weight:600}
.note-info{background:var(--accent-soft);border:1px solid var(--accent-line)}
.note-warn{background:var(--ochre-soft);border:1px solid var(--ochre-line)}
.note-bad{background:var(--oxide-soft);border:1px solid var(--oxide-line)}
.note .ic{font-family:var(--ff-mono);font-weight:600;flex:none}

/* ---------- dialogo ---------- */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(10,14,20,.55);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.scrim{align-items:center;padding:24px}}
.sheet{
  background:var(--surface);width:100%;max-width:580px;max-height:92vh;overflow-y:auto;
  border-radius:var(--r-lg) var(--r-lg) 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));
  box-shadow:var(--shadow-lift);
}
@media (min-width:700px){.sheet{border-radius:var(--r-lg);padding:22px}}
.sheet h3{font-size:18px;margin-bottom:4px}
.sheet-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}

.toast{
  position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);
  z-index:90;background:var(--ink);color:var(--ground);padding:10px 15px;border-radius:22px;
  font-size:13.5px;box-shadow:var(--shadow-lift);max-width:88vw;text-align:center;
}
@media (min-width:860px){.toast{bottom:26px}}

.dz{
  border:1.5px dashed var(--line-strong);border-radius:var(--r);padding:20px;text-align:center;
  background:var(--surface-2);transition:border-color .12s,background .12s;
}
.dz.hot{border-color:var(--accent);background:var(--accent-soft)}
.dz b{display:block;font-size:14.5px;margin-bottom:3px}
